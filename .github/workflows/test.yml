name: Run tests
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
jobs:
    lint:
            runs-on: ubuntu-latest
            steps:
                - uses: actions/checkout@v4
                - uses: astral-sh/setup-uv@v3
                - run: uv sync --dev
                - run: uv run ruff check .
                - run: uv run ty check src/
                  
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install uv
              uses: astral-sh/setup-uv@v3
            - run: uv sync --dev
            - run: uv run pytest tests/ -v --cov=yabk_dump --cov-report=xml --cov-report=term-missing
            - uses: codecov/codecov-action@v5
              with:
                  files: coverage.xml
                  token: ${{ secrets.CODECOV_TOKEN }}
